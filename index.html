<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Finanças — Controle Financeiro</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--primary:#2563eb;--green:#16a34a;--red:#ef4444;--orange:#f59e0b;--shadow:0 8px 30px #0f172a12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.app{display:flex;min-height:100vh}.sidebar{width:245px;background:#0f172a;color:#fff;padding:22px 14px;position:fixed;inset:0 auto 0 0}.brand{font-size:22px;font-weight:800;padding:8px 12px 24px}.nav button{width:100%;text-align:left;padding:12px;border-radius:10px;background:transparent;color:#cbd5e1;margin:3px 0}.nav button.active,.nav button:hover{background:#1e293b;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:24px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.top h1{margin:0;font-size:28px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 14px;border-radius:10px;background:#fff;border:1px solid var(--line)}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.danger{color:#b91c1c}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.kpi-label{color:var(--muted);font-size:13px}.kpi-value{font-size:26px;font-weight:800;margin-top:7px}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--primary)}.charts{grid-template-columns:1.4fr 1fr;margin-top:16px}.section-title{font-weight:800;margin:0 0 14px}.bar-row{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;margin:12px 0;font-size:13px}.bar{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--primary);border-radius:99px}.donut{width:190px;height:190px;border-radius:50%;margin:10px auto;background:conic-gradient(#2563eb 0 25%,#ef4444 25% 45%,#f59e0b 45% 62%,#16a34a 62% 76%,#8b5cf6 76% 88%,#94a3b8 88%);position:relative}.donut:after{content:"Gastos";position:absolute;inset:38px;background:#fff;border-radius:50%;display:grid;place-items:center;font-weight:800}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.pill{display:inline-block;padding:5px 8px;border-radius:999px;font-size:12px;background:#eff6ff;color:#1d4ed8}.empty{text-align:center;color:var(--muted);padding:35px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.field.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#0f172a80;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.modal-box{background:#fff;border-radius:18px;width:min(650px,100%);max-height:92vh;overflow:auto;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.mobile-nav{display:none}.hide{display:none!important}.report{max-width:900px;margin:auto}.report h2{margin-top:0}.report-card{border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}.report-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.muted{color:var(--muted)}@media(max-width:900px){.sidebar{display:none}.main{margin:0;width:100%;padding:16px 14px 85px}.kpis{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:7px}.mobile-nav button{background:none;font-size:11px;color:var(--muted)}.mobile-nav button.active{color:var(--primary);font-weight:800}.top{align-items:flex-start}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.report-kpis{grid-template-columns:1fr}}
@media print{.sidebar,.top,.mobile-nav,.no-print{display:none!important}.main{margin:0;width:100%;padding:0}.card{box-shadow:none}.report{display:block}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">💰 Finanças</div>
  <div class="nav" id="nav"></div>
</aside>
<main class="main">
  <div class="top">
    <div><h1 id="pageTitle">Dashboard</h1><div class="muted" id="subtitle"></div></div>
    <div class="actions no-print"><button class="btn" onclick="openModal()">＋ Lançamento</button><button class="btn primary" onclick="showReport()">📤 Relatório</button></div>
  </div>
  <section id="content"></section>
</main>
</div>
<div class="mobile-nav" id="mobileNav"></div>

<div class="modal" id="modal">
<div class="modal-box">
  <div class="modal-head"><h2>Novo lançamento</h2><button class="btn" onclick="closeModal()">✕</button></div>
  <form id="txForm">
    <div class="form-grid">
      <div class="field"><label>Tipo</label><select id="fType"><option value="expense">Despesa</option><option value="income">Entrada</option><option value="transfer">Transferência</option></select></div>
      <div class="field"><label>Data</label><input id="fDate" type="date" required></div>
      <div class="field full"><label>Descrição</label><input id="fDesc" placeholder="Ex.: Supermercado" required></div>
      <div class="field"><label>Valor</label><input id="fValue" type="number" min="0" step="0.01" placeholder="0,00" required></div>
      <div class="field"><label>Categoria</label><select id="fCat"></select></div>
      <div class="field"><label>Forma de pagamento</label><select id="fPay"><option>Pix</option><option>Débito</option><option>Crédito</option><option>Dinheiro</option><option>Boleto</option><option>Transferência</option></select></div>
      <div class="field"><label>Conta / cartão</label><select id="fAccount"></select></div>
      <div class="field"><label>Parcelas</label><input id="fInstallments" type="number" min="1" value="1"></div>
      <div class="field full"><label>Observação</label><textarea id="fNote" rows="2" placeholder="Opcional"></textarea></div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar lançamento</button></div>
  </form>
</div>
</div>

<script>
const CATS=["Casa","Alimentação","Carro","Saúde","Compras","Lazer","Assinaturas","Educação","Viagens","Impostos","Outros"];
const ACCOUNTS=["Conta Corrente","Nubank","Itaú","Santander","Dinheiro","Poupança","Investimentos"];
const NAV=[["dashboard","🏠","Início"],["transactions","📋","Lançamentos"],["cards","💳","Cartões"],["reports","📊","Relatórios"],["accounts","🏦","Contas"],["settings","⚙️","Mais"]];
let state=JSON.parse(localStorage.getItem("finance_app_v1")||"null")||{transactions:[],cards:[],accounts:[],customCats:[],month:new Date().toISOString().slice(0,7)};
let current="dashboard";

function save(){localStorage.setItem("finance_app_v1",JSON.stringify(state));}
function money(v){return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}
function monthName(m){return new Date(m+"-02").toLocaleDateString("pt-BR",{month:"long",year:"numeric"});}
function txMonth(t){return t.date.slice(0,7);}
function monthTx(){return state.transactions.filter(t=>txMonth(t)===state.month);}
function totals(){
 const ts=monthTx(); return {income:ts.filter(t=>t.type==="income").reduce((s,t)=>s+t.value,0),expense:ts.filter(t=>t.type==="expense").reduce((s,t)=>s+t.value,0)};
}
function setNav(){
 const html=NAV.map(n=>`<button class="${current===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]} &nbsp; ${n[2]}</button>`).join("");
 document.getElementById("nav").innerHTML=html;
 document.getElementById("mobileNav").innerHTML=NAV.slice(0,5).map(n=>`<button class="${current===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]}<br>${n[2]}</button>`).join("");
}
function go(p){current=p;render();}
function render(){
 setNav(); document.getElementById("pageTitle").textContent=NAV.find(x=>x[0]===current)?.[2]||"Finanças";
 document.getElementById("subtitle").textContent=monthName(state.month);
 const fn={dashboard:dashboard,transactions:transactions,cards:cards,reports:reports,accounts:accounts,settings:settings}[current]||dashboard;
 document.getElementById("content").innerHTML=fn();
}
function dashboard(){
 const t=totals(), balance=t.income-t.expense, ts=monthTx();
 const cats={}; ts.filter(x=>x.type==="expense").forEach(x=>cats[x.cat]=(cats[x.cat]||0)+x.value);
 const sorted=Object.entries(cats).sort((a,b)=>b[1]-a[1]), max=sorted[0]?.[1]||1;
 return `<div class="grid kpis">
  <div class="card"><div class="kpi-label">Entradas</div><div class="kpi-value green">${money(t.income)}</div></div>
  <div class="card"><div class="kpi-label">Despesas</div><div class="kpi-value red">${money(t.expense)}</div></div>
  <div class="card"><div class="kpi-label">Saldo do mês</div><div class="kpi-value blue">${money(balance)}</div></div>
  <div class="card"><div class="kpi-label">Economia</div><div class="kpi-value">${t.income?((balance/t.income)*100).toFixed(1):"0,0"}%</div></div>
 </div>
 <div class="grid charts">
  <div class="card"><h3 class="section-title">Gastos por categoria</h3>${sorted.length?sorted.slice(0,8).map(([c,v])=>`<div class="bar-row"><span>${c}</span><div class="bar"><i style="width:${v/max*100}%"></i></div><b>${money(v)}</b></div>`).join(""):'<div class="empty">Nenhuma despesa neste mês.</div>'}</div>
  <div class="card"><h3 class="section-title">Resumo visual</h3><div class="donut"></div><div style="text-align:center" class="muted">${ts.length} lançamentos no mês</div></div>
 </div>
 <div class="card" style="margin-top:16px"><h3 class="section-title">Últimos lançamentos</h3>${transactionTable(ts.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8))}</div>`;
}
function transactionTable(ts){
 if(!ts.length)return '<div class="empty">Nenhum lançamento encontrado.</div>';
 return `<div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Conta</th><th>Valor</th><th></th></tr></thead><tbody>${ts.map(t=>`<tr><td>${new Date(t.date+"T12:00").toLocaleDateString("pt-BR")}</td><td><b>${esc(t.desc)}</b><br><span class="muted">${t.pay}</span></td><td><span class="pill">${esc(t.cat)}</span></td><td>${esc(t.account)}</td><td class="${t.type==='income'?'green':'red'}"><b>${t.type==='income'?'+':'-'} ${money(t.value)}</b></td><td><button class="btn danger" onclick="delTx('${t.id}')">Excluir</button></td></tr>`).join("")}</tbody></table></div>`;
}
function transactions(){
 return `<div class="card"><div class="actions no-print" style="margin-bottom:14px"><input id="search" placeholder="🔎 Pesquisar..." oninput="filterTx()" style="padding:10px;border:1px solid var(--line);border-radius:10px;min-width:240px"><select id="filterType" onchange="filterTx()" class="btn"><option value="">Todos</option><option value="expense">Despesas</option><option value="income">Entradas</option></select></div><div id="txTable">${transactionTable(monthTx())}</div></div>`;
}
function filterTx(){
 const q=(document.getElementById("search")?.value||"").toLowerCase(), typ=document.getElementById("filterType")?.value||"";
 const ts=monthTx().filter(t=>(!typ||t.type===typ)&&JSON.stringify(t).toLowerCase().includes(q));
 document.getElementById("txTable").innerHTML=transactionTable(ts);
}
function cards(){
 const cards=state.cards.length?state.cards:[{id:"demo",name:"Meu cartão",brand:"Crédito",limit:5000,bill:0}];
 return `<div class="actions no-print" style="margin-bottom:14px"><button class="btn primary" onclick="addCard()">＋ Adicionar cartão</button></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${cards.map(c=>`<div class="card" style="background:linear-gradient(135deg,#1e3a8a,#2563eb);color:white"><b>${esc(c.name)}</b><span style="float:right">${esc(c.brand)}</span><div style="margin-top:28px;font-size:13px">Limite</div><strong style="font-size:24px">${money(c.limit)}</strong><div style="margin-top:8px">Fatura: ${money(c.bill||0)}</div></div>`).join("")}</div>`;
}
function accounts(){
 return `<div class="actions no-print" style="margin-bottom:14px"><button class="btn primary" onclick="addAccount()">＋ Adicionar conta</button></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(250px,1fr))">${ACCOUNTS.map(a=>{let b=state.transactions.filter(t=>t.account===a).reduce((s,t)=>s+(t.type==="income"?t.value:-t.value),0);return `<div class="card"><div class="muted">${a}</div><div class="kpi-value">${money(b)}</div></div>`}).join("")}</div>`;
}
function reports(){
 const t=totals(), b=t.income-t.expense;
 return `<div class="report"><div class="card"><h2>Relatório de ${monthName(state.month)}</h2><p class="muted">Resumo pronto para compartilhar com a família.</p><div class="report-kpis"><div class="report-card"><b>Entradas</b><h2 class="green">${money(t.income)}</h2></div><div class="report-card"><b>Despesas</b><h2 class="red">${money(t.expense)}</h2></div><div class="report-card"><b>Saldo</b><h2 class="blue">${money(b)}</h2></div></div><div class="report-card"><h3>Evolução e categorias</h3>${categoryReport()}</div><div class="report-card"><h3>Detalhamento</h3>${transactionTable(monthTx())}</div></div></div>`;
}
function categoryReport(){
 const c={};monthTx().filter(t=>t.type==="expense").forEach(t=>c[t.cat]=(c[t.cat]||0)+t.value);
 return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar-row"><span>${k}</span><div class="bar"><i style="width:${Math.min(100,v/(totals().expense||1)*100)}%"></i></div><b>${money(v)}</b></div>`).join("")||'<div class="empty">Sem despesas.</div>';
}
function settings(){
 return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
 <div class="card"><h3>📤 Exportação</h3><p class="muted">Compartilhe o resumo com sua esposa.</p><button class="btn primary" onclick="showReport()">Gerar relatório</button> <button class="btn" onclick="window.print()">PDF / Imprimir</button></div>
 <div class="card"><h3>💾 Backup</h3><button class="btn" onclick="exportJSON()">Exportar JSON</button> <button class="btn" onclick="document.getElementById('file').click()">Importar</button><input id="file" type="file" accept=".json" class="hide" onchange="importJSON(event)"></div>
 <div class="card"><h3>📊 Excel / CSV</h3><button class="btn" onclick="exportCSV()">Exportar CSV</button></div>
 <div class="card"><h3>🗓️ Mês</h3><input type="month" value="${state.month}" onchange="state.month=this.value;save();render()"></div>
 </div>`;
}
function openModal(){
 document.getElementById("modal").classList.add("open");
 document.getElementById("fDate").value=new Date().toISOString().slice(0,10);
 document.getElementById("fCat").innerHTML=CATS.concat(state.customCats||[]).map(x=>`<option>${x}</option>`).join("");
 document.getElementById("fAccount").innerHTML=ACCOUNTS.map(x=>`<option>${x}</option>`).join("");
}
function closeModal(){document.getElementById("modal").classList.remove("open")}
document.getElementById("txForm").addEventListener("submit",e=>{
 e.preventDefault();let n=+document.getElementById("fInstallments").value||1,v=+document.getElementById("fValue").value||0,d=new Date(document.getElementById("fDate").value+"T12:00");
 for(let i=0;i<n;i++){let dd=new Date(d);dd.setMonth(dd.getMonth()+i);state.transactions.push({id:crypto.randomUUID(),type:document.getElementById("fType").value,date:dd.toISOString().slice(0,10),desc:document.getElementById("fDesc").value+(n>1?` (${i+1}/${n})`:""),value:v/n,cat:document.getElementById("fCat").value,pay:document.getElementById("fPay").value,account:document.getElementById("fAccount").value,note:document.getElementById("fNote").value})}
 save();closeModal();render();
});
function delTx(id){if(confirm("Excluir este lançamento?")){state.transactions=state.transactions.filter(t=>t.id!==id);save();render()}}
function addCard(){let name=prompt("Nome do cartão:");if(!name)return;let limit=+prompt("Limite do cartão:","5000")||0;state.cards.push({id:crypto.randomUUID(),name,brand:"CRÉDITO",limit,bill:0});save();render()}
function addAccount(){let name=prompt("Nome da conta:");if(!name)return;ACCOUNTS.push(name);render()}
function exportJSON(){download("backup-financas.json",JSON.stringify(state,null,2),"application/json")}
function importJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();render();alert("Backup restaurado!")}catch{alert("Arquivo inválido.")}};r.readAsText(f)}
function exportCSV(){let rows=[["Data","Tipo","Descrição","Categoria","Pagamento","Conta","Valor"],...state.transactions.map(t=>[t.date,t.type,t.desc,t.cat,t.pay,t.account,t.value.toFixed(2).replace(".",",")])];download("lancamentos.csv","\ufeff"+rows.map(r=>r.map(csv).join(";")).join("\\n"),"text/csv;charset=utf-8")}
function csv(x){return '"'+String(x??"").replaceAll('"','""')+'"'}
function download(name,data,type){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function showReport(){current="reports";render();setTimeout(()=>window.scrollTo({top:0,behavior:"smooth"}),30)}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
render();
</script>
</body>
</html>
